
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${RESOLVEHUB_DB_NAME:-resolvehub}
      POSTGRES_USER: ${RESOLVEHUB_DB_USERNAME:-resolvehub}
      POSTGRES_PASSWORD: ${RESOLVEHUB_DB_PASSWORD:?set RESOLVEHUB_DB_PASSWORD}
    ports:
      - "127.0.0.1:${RESOLVEHUB_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESOLVEHUB_DB_USERNAME:-resolvehub} -d ${RESOLVEHUB_DB_NAME:-resolvehub}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - resolvehub-postgres:/var/lib/postgresql/data

volumes:
  resolvehub-postgres:
